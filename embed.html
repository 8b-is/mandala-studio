<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mandala</title>
<style>html,body{margin:0;height:100%;background:#fffdf9}canvas{width:100%;height:100%;touch-action:none;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let N=12,last=null,drawing=false;const col='#e8b05c';
function fit(){c.width=c.height=Math.min(innerWidth,innerHeight);}addEventListener('resize',fit);fit();
function pts(px,py){const S=c.width,cx=S/2,cy=S/2,dx=px-cx,dy=py-cy,rad=Math.hypot(dx,dy),b=Math.atan2(dy,dx),o=[];for(let k=0;k<N;k++){o.push([cx+Math.cos(b+k*2*Math.PI/N)*rad,cy+Math.sin(b+k*2*Math.PI/N)*rad]);o.push([cx+Math.cos(-b+k*2*Math.PI/N)*rad,cy+Math.sin(-b+k*2*Math.PI/N)*rad]);}return o;}
function seg(a,b){if(!a)return;const p=pts(a[0],a[1]),q=pts(b[0],b[1]);x.strokeStyle=col;x.lineWidth=2.5;x.lineCap='round';for(let i=0;i<p.length;i++){x.beginPath();x.moveTo(p[i][0],p[i][1]);x.lineTo(q[i][0],q[i][1]);x.stroke();}}
function P(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*c.width,(e.clientY-r.top)/r.height*c.height];}
c.addEventListener('pointerdown',e=>{drawing=true;last=P(e);seg(last,last);c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drawing)return;const p=P(e);seg(last,p);last=p});
addEventListener('pointerup',()=>{drawing=false;last=null});
</script></body></html>
